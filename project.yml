# XcodeGen spec. Generate the project with `xcodegen generate` (see README).
# The generated Relay.xcodeproj is committed too, so XcodeGen is optional.
name: Relay
options:
  bundleIdPrefix: dev.relay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Relay.xcconfig
  Release: Config/Relay.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Team, bundle id prefix and App Group live in Config/Relay.xcconfig (+ Local.xcconfig).
    CODE_SIGN_STYLE: Automatic
    # App targets use Swift 5 mode with complete concurrency checking as warnings;
    # RelayKit itself builds in Swift 6 mode (docs/DECISIONS.md, D-011).
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
packages:
  RelayKit:
    path: .
targets:
  Relay:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
    dependencies:
      - target: RelayMessagesExtension
      - package: RelayKit
        product: RelayCore
      - package: RelayKit
        product: RelayGames
      - package: RelayKit
        product: RelayMessages
      - package: RelayKit
        product: RelayAnalytics
      - package: RelayKit
        product: RelayUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELAY_BUNDLE_ID_PREFIX).Relay
        # Entitlements files are hand-written; Config/Relay.xcconfig picks them (D-025).
        CODE_SIGN_ENTITLEMENTS: $(RELAY_APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RelayMessagesExtension:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: MessagesExtension
        excludes:
          - "*.entitlements"
    dependencies:
      - sdk: Messages.framework
      - package: RelayKit
        product: RelayCore
      - package: RelayKit
        product: RelayGames
      - package: RelayKit
        product: RelayMessages
      - package: RelayKit
        product: RelayAnalytics
      - package: RelayKit
        product: RelayUI
    info:
      path: MessagesExtension/Info.plist
      properties:
        CFBundleDisplayName: Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RelayAppGroup: $(RELAY_APP_GROUP_IN_USE)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RELAY_BUNDLE_ID_PREFIX).Relay.MessagesExtension
        CODE_SIGN_ENTITLEMENTS: $(RELAY_EXTENSION_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
schemes:
  Relay:
    build:
      targets:
        Relay: all
        RelayMessagesExtension: all
    test:
      gather_coverage_data: true
